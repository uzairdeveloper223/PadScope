name: Feature request
description: Suggest an improvement.
labels: [enhancement]
body:
  - type: textarea
    id: task
    attributes:
      label: What are you trying to do?
      description: What gets in the way today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed improvement
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Examples (optional)
      description: Screenshots, other tools, or technical references.
