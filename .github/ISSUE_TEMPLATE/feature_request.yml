name: Feature request
description: Suggest a specific improvement to the controller workbench.
labels: [enhancement]
body:
  - type: textarea
    id: task
    attributes:
      label: What are you trying to do?
      description: Describe the controller-testing or practice task and what gets in the way today.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed improvement
      description: Explain the controls or result you would expect and how they would help.
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Examples or supporting details
      description: Relevant devices, screenshots, existing tools, or technical references are useful.
