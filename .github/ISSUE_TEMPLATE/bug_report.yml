name: Bug report
description: Something is not working.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Check [troubleshooting](https://github.com/uzairdeveloper223/PadScope#troubleshooting) and existing issues first.
  - type: textarea
    id: behavior
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open the live app or a local build.
        2. Connect a controller or enable preview.
        3. ...
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Browser and operating system
      placeholder: Browser and OS names; versions if known.
    validations:
      required: true
  - type: dropdown
    id: connection
    attributes:
      label: Input and connection
      options:
        - USB controller
        - Bluetooth controller
        - Wireless receiver
        - Simulated preview
        - Pointer or keyboard only
        - Other or unknown
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: Controller (if relevant)
      placeholder: Model and vendor/product IDs if known.
  - type: textarea
    id: evidence
    attributes:
      label: Anything else?
      description: Screenshots, errors, or a PadScope JSON report.
