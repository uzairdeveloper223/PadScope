name: Controller compatibility
description: Report results for your controller.
labels: [compatibility]
body:
  - type: markdown
    attributes:
      value: |
        USB and Bluetooth can behave differently. Say which connection you tested.
  - type: input
    id: controller
    attributes:
      label: Controller
      placeholder: Brand and model; firmware/profile if known.
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Browser and operating system
      placeholder: Browser/OS names and versions.
    validations:
      required: true
  - type: dropdown
    id: connection
    attributes:
      label: Connection tested
      options:
        - USB
        - Bluetooth
        - Wireless receiver
        - Other or unknown
    validations:
      required: true
  - type: input
    id: identifiers
    attributes:
      label: Device IDs and active input source
      description: Copy the vendor/product IDs and Gamepad/WebHID status if available.
  - type: textarea
    id: results
    attributes:
      label: Results
      description: Mark each feature working, failed, unavailable, or untested.
      value: |
        - Buttons and sticks: untested
        - Analog triggers: untested
        - Guided controller check: untested
        - Gyro and acceleration: untested
        - Touchpad: untested
        - Battery estimate: untested
        - Rumble: untested
        - Lightbar: untested
        - Gyro range and blaster inspection: untested
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Anything else?
      description: Firmware/profile notes, screenshots, or a PadScope report.
